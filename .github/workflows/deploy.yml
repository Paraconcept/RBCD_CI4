name: Deploy to rbcd.be

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ssh.rbcd.be
          username: rbcd.be
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --quiet
            php spark migrate --no-interaction
            chmod -R 755 writable/
            # Le serveur web garde les anciens fichiers PHP en cache (OPcache) : on le vide avec un jeton à usage unique
            php -r 'echo bin2hex(random_bytes(16));' > writable/deploy_token
            curl -sS --max-time 20 "https://rbcd.be/public/opcache-reset.php?token=$(cat writable/deploy_token)" || echo "Vidage du cache PHP impossible"
            echo
            rm -f writable/deploy_token
