<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Marquoirs RBC Disonais — Guide du directeur sportif</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
    @page { size: A4 landscape; margin: 0; }
    :root {
        --navy: #0a1020; --navy-2: #16213d; --red: #84252B; --red-l: #b8343c;
        --yellow: #ffcc00; --sky: #4fc3f7; --green: #22c55e; --orange: #f59e0b;
        --ink: #1b2233; --muted: #5d677c; --line: #e3e7ef; --paper: #ffffff; --soft: #f4f6fb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #8a93a6; }
    body { font-family: 'Barlow', sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page {
        width: 297mm; height: 210mm; margin: 0 auto 8mm; background: var(--paper);
        position: relative; overflow: hidden; page-break-after: always; break-after: page;
        display: flex; flex-direction: column;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
    @media print { html, body { background: none; } .page { margin: 0; } }

    /* En-tête et pied des pages intérieures */
    .head { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 6mm; padding: 6mm 12mm; border-bottom: 1.6mm solid var(--red); }
    .head .num { width: 13mm; height: 13mm; border-radius: 50%; background: var(--red); display: grid; place-items: center;
                 font-family: 'Barlow Condensed'; font-weight: 800; font-size: 8mm; flex: none; }
    .head .num i { font-size: 6mm; }
    .head h1 { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 11mm; margin: 0; line-height: 1; letter-spacing: .01em; }
    .head p { margin: 1.2mm 0 0; color: #aeb7cc; font-size: 4.2mm; }
    .head img { height: 13mm; margin-left: auto; }
    .body { flex: 1; padding: 8mm 12mm 0; display: flex; gap: 9mm; min-height: 0; }
    .foot { display: flex; justify-content: space-between; padding: 3.5mm 12mm 5mm; color: var(--muted); font-size: 3.4mm; }
    .foot b { color: var(--red); }

    .col { display: flex; flex-direction: column; gap: 4mm; min-width: 0; }
    .text { flex: 0 0 92mm; }
    .wide { flex: 1; }

    .shot { width: 100%; border-radius: 3mm; border: .5mm solid #0a1020; display: block; }
    .caption { font-size: 3.5mm; color: var(--muted); margin-top: 2mm; text-align: center; }

    h2 { font-family: 'Barlow Condensed'; font-weight: 700; font-size: 6.4mm; margin: 0 0 1.5mm; color: var(--navy); }
    h2 i { color: var(--red); margin-right: 2mm; }
    p, li { font-size: 4.25mm; line-height: 1.42; margin: 0; }
    ul.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2.8mm; }
    ul.steps li { position: relative; padding-left: 9mm; }
    ul.steps li::before {
        content: counter(step); counter-increment: step; position: absolute; left: 0; top: .3mm;
        width: 6.2mm; height: 6.2mm; border-radius: 50%; background: var(--red); color: #fff;
        font-family: 'Barlow Condensed'; font-weight: 700; font-size: 4mm; display: grid; place-items: center;
    }
    ul.steps { counter-reset: step; }
    ul.dots { margin: 0; padding-left: 5mm; display: flex; flex-direction: column; gap: 1.8mm; list-style: disc; }
    ul.steps ul.dots li { padding-left: 0; counter-increment: none; }
    ul.steps ul.dots li::before { content: none; }

    .kbd, kbd {
        display: inline-block; min-width: 6.5mm; padding: .1mm 1.6mm; border-radius: 1.2mm; text-align: center;
        background: var(--navy); color: #fff; font-family: 'Barlow Condensed'; font-weight: 700; font-size: 4mm;
        box-shadow: 0 .6mm 0 #000; line-height: 1.5;
    }
    .note { background: var(--soft); border-left: 1.4mm solid var(--red); border-radius: 0 2mm 2mm 0; padding: 3mm 4mm; }
    .note.green { border-left-color: var(--green); }
    .note.orange { border-left-color: var(--orange); }
    .note p + p { margin-top: 1.5mm; }

    /* Couverture */
    .cover { background: radial-gradient(ellipse at 70% 0%, #1d2f5c 0%, var(--navy) 60%); color: #fff; padding: 0; }
    .cover .band { height: 2.2mm; background: var(--red); }
    .cover .inner { flex: 1; display: grid; grid-template-columns: 112mm 1fr; gap: 10mm; padding: 16mm 14mm 10mm; align-items: center; }
    .cover .crest { height: 34mm; margin-bottom: 7mm; }
    .cover .kicker { font-family: 'Barlow Condensed'; font-weight: 600; letter-spacing: .25em; text-transform: uppercase; color: #aeb7cc; font-size: 5mm; }
    .cover h1 { font-family: 'Barlow Condensed'; font-weight: 800; font-size: 21mm; line-height: .92; margin: 3mm 0 5mm; }
    .cover h1 span { color: var(--yellow); }
    .cover .lead { font-size: 5.2mm; line-height: 1.45; color: #d7dceb; }
    .cover .shot { border: .8mm solid #2a3a63; }
    .cover .bottom { display: flex; justify-content: space-between; padding: 0 14mm 9mm; color: #8f9ab3; font-size: 3.8mm; }
    .cover .tags { display: flex; gap: 3mm; margin-top: 8mm; flex-wrap: wrap; }
    .cover .tags span { border: .35mm solid #3a4a73; border-radius: 10mm; padding: 1.2mm 4mm; font-size: 3.9mm; color: #d7dceb; }
    .cover .tags i { color: var(--yellow); margin-right: 1.5mm; }

    /* Vue d'ensemble */
    .overview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6mm; }
    .card { background: var(--soft); border-radius: 3mm; padding: 5mm 4.5mm; border-top: 1.4mm solid var(--red); }
    .card .ico { width: 12mm; height: 12mm; border-radius: 3mm; background: var(--navy); color: var(--yellow); display: grid; place-items: center; font-size: 5.5mm; margin-bottom: 3mm; }
    .card h3 { font-family: 'Barlow Condensed'; font-size: 6mm; margin: 0 0 1.5mm; color: var(--navy); }
    .card p { font-size: 3.95mm; }

    /* Pavé numérique */
    .pad {
        display: grid; grid-template-columns: repeat(4, 21mm); grid-template-rows: repeat(5, 21mm); gap: 2.4mm;
        background: #1c2233; padding: 4.5mm; border-radius: 5mm; box-shadow: 0 3mm 8mm rgba(0,0,0,.35); align-self: start;
    }
    .key {
        border-radius: 2.6mm; background: #3a4258; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: 'Barlow Condensed'; font-weight: 800; font-size: 8mm; line-height: 1; box-shadow: inset 0 -1.1mm 0 rgba(0,0,0,.35);
        position: relative;
    }
    .key small { font-family: 'Barlow'; font-weight: 600; font-size: 2.6mm; margin-top: 1mm; opacity: .95; text-align: center; line-height: 1.05; }
    .key.off { background: #2a3043; color: #6f7891; font-size: 5mm; }
    .key.digit { background: #2f4a7a; }
    .key.plus { background: #16a34a; }
    .key.minus { background: #d97706; }
    .key.enter { background: var(--red); grid-row: span 2; }
    .key.star { background: #0284c7; }
    .key.slash { background: #64748b; }
    .key.menu { background: #0d9488; }
    .key.pause { background: #eab308; color: #0a1020; }
    .key.zero { grid-column: span 2; }
    .legend { display: flex; flex-direction: column; gap: 2.6mm; }
    .legend .row { display: grid; grid-template-columns: 17mm 1fr; gap: 3mm; align-items: center; }
    .legend .sw { height: 9mm; border-radius: 2mm; color: #fff; display: grid; place-items: center; font-family: 'Barlow Condensed'; font-weight: 800; font-size: 5.2mm; }
    .legend b { font-family: 'Barlow Condensed'; font-size: 5mm; color: var(--navy); display: block; line-height: 1.1; }
    .legend span { font-size: 3.85mm; color: var(--ink); line-height: 1.3; }

    /* Écran annoté */
    .annot { position: relative; }
    .pin {
        position: absolute; width: 7.5mm; height: 7.5mm; border-radius: 50%; background: var(--yellow); color: var(--navy);
        font-family: 'Barlow Condensed'; font-weight: 800; font-size: 4.6mm; display: grid; place-items: center;
        border: .7mm solid var(--navy); transform: translate(-50%, -50%); box-shadow: 0 .8mm 2mm rgba(0,0,0,.5);
    }
    .keylist { display: grid; grid-template-columns: 1fr 1fr; gap: 2.2mm 6mm; }
    .keylist div { display: grid; grid-template-columns: 7.5mm 1fr; gap: 2.5mm; align-items: start; font-size: 3.95mm; line-height: 1.3; }
    .keylist .n { width: 7mm; height: 7mm; border-radius: 50%; background: var(--yellow); color: var(--navy); border: .6mm solid var(--navy);
                  display: grid; place-items: center; font-family: 'Barlow Condensed'; font-weight: 800; font-size: 4.2mm; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
    .formula { background: var(--navy); color: #fff; border-radius: 2mm; padding: 3.5mm 4mm; text-align: center; font-size: 11.5pt; line-height: 1.5; }
    .formula b { color: #f5c400; }
    .formula small { display: block; font-size: 8.5pt; opacity: .8; margin-top: 1mm; }
    table.ex { width: 100%; border-collapse: collapse; font-size: 9.5pt; margin-top: 1.5mm; }
    table.ex th, table.ex td { padding: 1.2mm 2mm; border-bottom: .3mm solid #d7dbe3; text-align: center; }
    table.ex th { font-size: 8pt; text-transform: uppercase; letter-spacing: .04em; color: #555; }
    table.ex td:first-child, table.ex th:first-child { text-align: left; }
    table.ex tr.win td { font-weight: 700; color: var(--red); }
    .phone { width: 100%; border-radius: 6mm; border: 2.2mm solid #11141d; display: block; }

    .shot.crop { object-fit: cover; object-position: top left; }
    .text { flex: 0 0 100mm; }
    .tag { display: inline-block; border-radius: 1.2mm; padding: 0 1.6mm; font-size: 3.4mm; font-weight: 700; color: #fff; line-height: 1.6; }
    .ico { display: inline-grid; place-items: center; width: 5.6mm; height: 5.6mm; border-radius: 1mm; color: #fff; font-size: 3mm; vertical-align: -1mm; }
    .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5mm; }
    .flow .card h3 i { color: var(--red); margin-right: 1.5mm; }
    .menuimg { width: 100%; border-radius: 3mm; border: .5mm solid #0a1020; display: block; }
</style>
</head>
<body>
